name = "deskmonk"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Everything lives on deskmonk.app: the website (../docs) and, on paths with no file there,
# the API (/api/events, /api/license/*), /admin and the /buy checkout pages.
workers_dev = false
routes = [{ pattern = "deskmonk.app", custom_domain = true }]

[assets]
directory = "../docs"
binding = "ASSETS"
# These pages are translated by the worker (src/site.ts) before they are sent; every other file is served as is.
run_worker_first = ["/", "/index.html", "/pricing", "/pricing.html"]

[[d1_databases]]
binding = "DB"
database_name = "deskmonk"
database_id = "e0bfa82a-e5c0-4b68-ade8-4c5fad7b1af2"

# Secret, not here: ADMIN_TOKEN (wrangler secret put ADMIN_TOKEN), the /admin password for user "admin".

# deskMonk Pro (Paddle, the live bubbleTranslate account; product pro_01m655e6q98g48am0eqdqfgre3).
# Secrets, not here: PADDLE_CLIENT_TOKEN, PADDLE_API_KEY, PADDLE_WEBHOOK_SECRET (wrangler secret put …).
[vars]
PADDLE_ENV = "production"
PADDLE_PRICE_MONTHLY = "pri_01m655mbyt5f86ptdtqpsggdza"
PADDLE_PRICE_YEARLY = "pri_01m655nmwqf9t6zj9bakdepxb8"
