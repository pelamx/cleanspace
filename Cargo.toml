[workspace]
members = ["server"]

[package]
name = "deskmonk"
version = "0.3.0"
edition = "2024"

[features]
default = ["gui", "tui"]
gui = ["dep:eframe", "dep:rfd", "dep:objc2", "dep:objc2-app-kit"]
tui = ["dep:ratatui"]

[[bin]]
name = "deskmonk"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "deskmonk-tui"
path = "src/bin/deskmonk-tui.rs"
required-features = ["tui"]

[dependencies]
dirs = "6"
eframe = { version = "0.35", optional = true }
ratatui = { version = "0.30", optional = true }
rfd = { version = "0.17.2", optional = true }
serde_json = "1"
sha2 = "0.10"
trash = "5.2.9"
ureq = "3"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# Already in the tree via eframe; used to hide the app when its window is closed.
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "NSApplication", "NSResponder"] }

[target.'cfg(unix)'.dependencies]
# Already in the tree; statvfs and page-cache control for the disk speed test.
libc = "0.2"
