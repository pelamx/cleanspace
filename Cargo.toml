[workspace]
members = ["server"]

[package]
name = "deskmonk"
version = "0.3.0"
edition = "2024"

[features]
default = ["gui", "tui"]
gui = ["dep:eframe", "dep:rfd", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]
tui = ["dep:ratatui"]

[[bin]]
name = "deskmonk"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "deskmonk-tui"
path = "src/bin/deskmonk-tui.rs"
required-features = ["tui"]

[dependencies]
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["stream"] }
dirs = "6"
eframe = { version = "0.35", optional = true }
ratatui = { version = "0.30", optional = true }
rfd = { version = "0.17.2", optional = true }
serde_json = "1"
getrandom = "0.3"
sha2 = "0.10"
tar = "0.4"
trash = "5.2.9"
ureq = "3"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# Already in the tree via eframe; used to hide the app when its window is closed, and for app icons.
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext"] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSString", "NSGeometry"] }

[target.'cfg(unix)'.dependencies]
# Already in the tree; statvfs and page-cache control for the disk speed test.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Already in the tree via eframe and crossterm; free space, locale, time zone and the app lock's process list.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Time",
] }
