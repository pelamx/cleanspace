name: CI

permissions:
  contents: write

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # 22.04: older glibc, so the Linux build also runs on Debian 12 / Ubuntu 22.04 and newer.
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release --workspace
        env:
          DESKMONK_TELEMETRY_URL: ${{ vars.DESKMONK_TELEMETRY_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: deskmonk-${{ runner.os }}
          path: |
            target/release/deskmonk
            target/release/deskmonk-tui
            target/release/deskmonk-server
            target/release/*.exe
      - if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Linux'
        run: |
          mkdir deskmonk-linux-x86_64
          cp target/release/deskmonk assets/icon.png assets/deskmonk.desktop deskmonk-linux-x86_64/
          tar czf deskmonk-linux-x86_64.tar.gz deskmonk-linux-x86_64
      - if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          files: deskmonk-linux-x86_64.tar.gz

  # Static Linux TUI binary: runs on any x86_64 distro (GCP/AWS images included), no glibc version issues.
  tui-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl --no-default-features --features tui --bin deskmonk-tui
        env:
          DESKMONK_TELEMETRY_URL: ${{ vars.DESKMONK_TELEMETRY_URL }}
      - run: cp target/x86_64-unknown-linux-musl/release/deskmonk-tui deskmonk-tui-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: deskmonk-tui-linux-x86_64
          path: deskmonk-tui-linux-x86_64
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: deskmonk-tui-linux-x86_64
