name: CI

permissions:
  contents: write

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Release builds talk to these servers; an unset repository variable builds without them.
env:
  DESKMONK_TELEMETRY_URL: ${{ vars.DESKMONK_TELEMETRY_URL }}
  DESKMONK_LICENSE_URL: ${{ vars.DESKMONK_LICENSE_URL }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # One app for Apple Silicon and Intel Macs.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: packaging/macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  # AppImage + tar.gz per CPU, built on AlmaLinux 8 (glibc 2.28) so they run on nearly every distro from 2019 on.
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64
          - runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: packaging/linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ runner.arch }}
          path: |
            dist/*.AppImage
            dist/*.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bin deskmonk --bin deskmonk-tui
      - run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Force -Path target/release/deskmonk.exe, target/release/deskmonk-tui.exe, README.md -DestinationPath dist/deskmonk-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  # Microsoft Store package. Only on a tag: it is the one artifact whose identity must match the
  # Partner Center reservation, and a package built from a branch could never be submitted anyway.
  # The Store signs the upload itself, so this stays unsigned — which is also why it is downloaded
  # from here and handed to Partner Center rather than attached to the public release: nobody can
  # install an unsigned .msix, and offering one would only produce support mail.
  msix:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    env:
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_DISPLAY: ${{ vars.MSIX_PUBLISHER_DISPLAY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Identity cannot be guessed and a wrong one is rejected on upload, so stop here rather than
      # produce a package that looks submittable and is not.
      - name: The Store package needs its Partner Center identity
        if: vars.MSIX_IDENTITY_NAME == '' || vars.MSIX_PUBLISHER == ''
        run: |
          echo "::error::MSIX_IDENTITY_NAME / MSIX_PUBLISHER are not set, so the package would carry a test identity."
          echo "Copy both from Partner Center > Product > Product identity into Actions > Variables."
          exit 1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/msix.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: msix
          path: dist/*.msix

  # Static terminal UI: runs on any Linux of that CPU (servers, cloud images).
  tui-musl:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target ${{ matrix.target }} --no-default-features --features tui --bin deskmonk-tui
      - run: mkdir dist && cp target/${{ matrix.target }}/release/deskmonk-tui dist/deskmonk-tui-linux-${TARGET%%-*}
        env:
          TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: tui-${{ matrix.target }}
          path: dist/*

  # A version tag (v0.4.0) publishes everything above as one GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, macos, linux, windows, tui-musl]
    runs-on: ubuntu-latest
    steps:
      # Without this variable `plan::URL` is None, `is_pro()` is true for everyone and the compiler
      # drops the whole paywall — a release that can never be bought. v0.3.0 shipped exactly that,
      # and nothing said a word, so refuse to publish instead of finding out from the sales figures.
      - name: Refuse to publish a build with no licence server
        if: vars.DESKMONK_LICENSE_URL == ''
        run: |
          echo "::error::DESKMONK_LICENSE_URL is empty, so this build has no paywall: every copy is Pro for good."
          echo "Set it under Settings → Secrets and variables → Actions → Variables, then push the tag again."
          echo "Shipping free on purpose? Delete this step."
          exit 1
      # Not fatal: a build with no telemetry is a legitimate choice. But the admin panel is fed
      # only by these events, so without it every figure there stays at zero for this release.
      - name: Warn when the release reports no usage at all
        if: vars.DESKMONK_TELEMETRY_URL == ''
        run: |
          echo "::warning::DESKMONK_TELEMETRY_URL is empty, so this release sends nothing and /admin will show zero installs for it."
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
