name: CI

permissions:
  contents: write

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Release builds talk to these servers; an unset repository variable builds without them.
env:
  DESKMONK_TELEMETRY_URL: ${{ vars.DESKMONK_TELEMETRY_URL }}
  DESKMONK_LICENSE_URL: ${{ vars.DESKMONK_LICENSE_URL }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Without the servers: tests/startup.rs runs the real app, and every run would count as a new user in /admin.
      - run: env -u DESKMONK_TELEMETRY_URL -u DESKMONK_LICENSE_URL cargo test --workspace
        shell: bash

  # One app for Apple Silicon and Intel Macs.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: packaging/macos.sh
      # The Mac App Store build (sandbox + StoreKit) must keep compiling and linking; it is uploaded by hand.
      - run: cargo build --features appstore --bin deskmonk
        env:
          CARGO_TARGET_DIR: target/appstore
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  # AppImage, tar.gz, .deb, .rpm and Arch package per CPU, built on AlmaLinux 8 (glibc 2.28) so they run on nearly every distro from 2019 on.
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64
          - runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: packaging/linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ runner.arch }}
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bin deskmonk --bin deskmonk-tui
      - run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Force -Path target/release/deskmonk.exe, target/release/deskmonk-tui.exe, README.md -DestinationPath dist/deskmonk-windows-x86_64.zip
          # What installed copies download to update themselves (src/update.rs).
          tar -czf dist/deskmonk-windows-x86_64.tar.gz -C target/release deskmonk.exe deskmonk-tui.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.tar.gz

  # Static terminal UI: runs on any Linux of that CPU (servers, cloud images).
  tui-musl:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target ${{ matrix.target }} --no-default-features --features tui --bin deskmonk-tui
      - run: mkdir dist && cp target/${{ matrix.target }}/release/deskmonk-tui dist/deskmonk-tui-linux-${TARGET%%-*}
        env:
          TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: tui-${{ matrix.target }}
          path: dist/*

  # Installs the real packages on other distros and starts the app and the password prompt, so a missing dependency
  # is found here and not by a user. deskmonk.app points nowhere: these runs must not count as installs in /admin.
  linux-install:
    needs: linux
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            install: apt-get update -qq && apt-get install -y -qq ./dist/deskmonk_*_amd64.deb xvfb xauth libgl1-mesa-dri
          - image: ubuntu:24.04
            install: apt-get update -qq && apt-get install -y -qq ./dist/deskmonk_*_amd64.deb xvfb xauth libgl1-mesa-dri
          - image: debian:12
            install: apt-get update -qq && apt-get install -y -qq ./dist/deskmonk_*_amd64.deb xvfb xauth libgl1-mesa-dri
          - image: fedora:latest
            install: dnf install -y -q ./dist/deskmonk-*.x86_64.rpm xorg-x11-server-Xvfb xorg-x11-xauth mesa-dri-drivers which
          - image: rockylinux:9
            install: dnf install -y -q ./dist/deskmonk-*.x86_64.rpm xorg-x11-server-Xvfb xorg-x11-xauth mesa-dri-drivers which
          - image: rockylinux:8
            install: dnf install -y -q ./dist/deskmonk-*.x86_64.rpm xorg-x11-server-Xvfb xorg-x11-xauth mesa-dri-drivers which
          - image: opensuse/tumbleweed
            install: zypper --non-interactive --no-gpg-checks install ./dist/deskmonk-*.x86_64.rpm xvfb-run xauth Mesa-dri which
          - image: archlinux:latest
            install: pacman -Sy --noconfirm --needed xorg-server-xvfb xorg-xauth mesa which && pacman -U --noconfirm ./dist/deskmonk-*-x86_64.pkg.tar.zst
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-X64
          path: dist
      - run: ${{ matrix.install }}
      - name: The app and the password prompt start and keep running
        run: |
          echo "127.0.0.1 deskmonk.app" >> /etc/hosts
          export HOME=$(mktemp -d)
          # Still running after 10 s is what "starts" means: timeout's own code is 124.
          set +e; xvfb-run -a timeout 10 deskmonk; code=$?; set -e; test "$code" = 124
          set +e; xvfb-run -a timeout 10 deskmonk --unlock-prompt /nonexistent.desktop; code=$?; set -e; test "$code" = 124
          deskmonk-tui --key 2>&1 | grep -q deskmonk-tui
        shell: bash

  # The plain archive and the AppImage, without any package manager help.
  linux-archives:
    needs: linux
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-X64
          path: dist
      - run: apt-get update -qq && apt-get install -y -qq xvfb xauth libgl1-mesa-dri libx11-xcb1 libxcursor1 libxrandr2 libxi6 libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libwayland-cursor0 libwayland-egl1 libegl1 libgl1 desktop-file-utils
      - name: The archive installs into the menu and starts; the AppImage starts
        run: |
          echo "127.0.0.1 deskmonk.app" >> /etc/hosts
          export HOME=$(mktemp -d)
          tar xzf dist/deskmonk-linux-x86_64.tar.gz -C "$HOME"
          "$HOME/deskmonk-linux-x86_64/install.sh"
          desktop-file-validate "$HOME/.local/share/applications/deskmonk.desktop"
          set +e; xvfb-run -a timeout 10 "$HOME/.local/bin/deskmonk"; code=$?; set -e; test "$code" = 124
          chmod +x dist/*.AppImage
          set +e; APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a timeout 10 dist/deskMonk-*-linux-x86_64.AppImage; code=$?; set -e; test "$code" = 124
        shell: bash

  # A version tag (v0.4.0) publishes everything above as one GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, macos, linux, linux-install, linux-archives, windows, tui-musl]
    runs-on: ubuntu-latest
    steps:
      # Without the license server the apps unlock Pro for everyone; without telemetry nothing is counted.
      - name: Release builds know their servers
        run: test -n "$DESKMONK_LICENSE_URL" && test -n "$DESKMONK_TELEMETRY_URL"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
